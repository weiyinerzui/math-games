<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 小羽互动数学课堂</title>
<style>
  :root{ --ink:#3a2a48; --sub:#7a6a88; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:linear-gradient(165deg,#fdf2f8,#eef4ff 55%,#fefce8);color:var(--ink);
    min-height:100vh;padding:24px 16px;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto}
  header{text-align:center;padding:16px 8px}
  h1{font-size:clamp(26px,6vw,40px);text-shadow:1px 1px 0 #fff,2px 2px 0 #e9d5ec}
  .sub{color:var(--sub);font-size:14px;margin-top:6px}
  .motto{display:inline-block;margin-top:10px;background:#fff;border:2px dashed #a78bfa;
    color:#7c3aed;font-weight:700;font-size:13px;padding:5px 16px;border-radius:20px}
  .list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px}
  a.card{display:block;background:#fff;border-radius:18px;padding:22px 20px;text-decoration:none;
    color:inherit;box-shadow:0 8px 24px rgba(120,60,160,.12);border:1px solid #f0e4f5;transition:.2s}
  a.card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(120,60,160,.2)}
  .card .emoji{font-size:44px;line-height:1}
  .card h2{font-size:20px;margin:10px 0 4px}
  .card p{font-size:13.5px;color:var(--sub)}
  .card .meta{margin-top:10px;font-size:12.5px;font-weight:700;color:#7c3aed}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:32px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 小羽互动数学课堂</h1>
    <p class="sub">依据认知负荷理论与交替实例原则设计 · 从易到难闯关学数学</p>
    <span class="motto">每课一个知识点，玩着玩着就会了！</span>
  </header>

  <div class="list">
    <a class="card" href="./flowers/">
      <div class="emoji">🌸</div>
      <h2>花店大侦探 · 买花比价</h2>
      <p>一束花 30 元共 6 枝，单买一枝 8 元，买一束每枝便宜多少？金币分配 + 天平比价动画。</p>
      <div class="meta">4 关 · 14 题 · 适合三年级</div>
    </a>
    <a class="card" href="https://weiyinerzui.github.io/math-games/index.html">
      <div class="emoji">🏃</div>
      <h2>追及大冒险 · 追及问题</h2>
      <p>甲每小时走 6 千米，乙每小时走 4 千米，乙先走 8 千米，甲几小时追上？SVG 追赶动画逐时逼近。</p>
      <div class="meta">5 关 · 18 题 · 适合三年级</div>
    </a>
  </div>

  <div class="foot">在手机或电脑浏览器打开即可，进度自动保存</div>
</div>
</body>
</html>
